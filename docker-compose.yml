services:
  lumibot:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumibot:latest
    container_name: lumibot
    restart: unless-stopped
    environment:
      # 从同目录 .env 注入（compose 自动读取 .env 做变量插值）
      - ENV=${ENV:-dev}
      - QQ_APP_ID=${QQ_APP_ID:-}
      - QQ_TOKEN=${QQ_TOKEN:-}
      - QQ_SECRET=${QQ_SECRET:-}
      - QQ_OPENAPI_TIMEOUT=${QQ_OPENAPI_TIMEOUT:-5s}
      - HTTP_ADDR=${HTTP_ADDR:-:8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
